services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///backend/data/profit_pilot.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - profit-pilot-data:/app/backend/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  profit-pilot-data:
